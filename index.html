<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMEU SafeSpace | Cyberbullying Reporting & Peer Support</title>
    <meta name="description" content="AMEU SafeSpace — Confidential, mobile-first cyberbullying reporting and peer-support platform for students at African Methodist Episcopal University." />
    <meta property="og:title" content="AMEU SafeSpace | Your Voice. Your Safety. Your Digital Space." />
    <meta property="og:description" content="Confidential cyberbullying reporting and peer-support platform by Career Launchpad Liberia, Ministry of Justice, and Federation of Liberian Youth." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0e3820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AMEU SafeSpace" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-200 selection:text-emerald-950 font-sans">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8FAF8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #064E32; text-align: center; padding: 20px;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background-color: #064E32; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(6, 78, 50, 0.3); margin-bottom: 16px;">
          <svg viewBox="0 0 36 36" fill="none" style="width: 28px; height: 28px;">
            <path d="M18 4C26 4 30 7 30 7C30 19 26 28 18 32C10 28 6 19 6 7C6 7 10 4 18 4Z" fill="#138A45" stroke="#25A55B" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M18 7C24 7 27 9.5 27 9.5C27 18 24 25.5 18 28.5C12 25.5 9 18 9 9.5C9 9.5 12 7 18 7Z" fill="#064E32"/>
            <path d="M13 18L16.5 21.5L23.5 14.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.02em;">AMEU SafeSpace</h2>
        <p style="font-size: 13px; color: #138A45; margin: 0; font-weight: 600;">Confidential Digital Safety &amp; Peer Support</p>
      </div>
    </div>
    <script>
      // Self-healing recovery: if an asset fails to load due to stale cache, unregister worker and reload
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var retryKey = 'ameu_sw_retry';
          if (!sessionStorage.getItem(retryKey)) {
            sessionStorage.setItem(retryKey, String(Date.now()));
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            setTimeout(function() { window.location.reload(); }, 350);
          }
        }
      }, true);

      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname.includes('ais-dev-');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              keys.forEach((key) => caches.delete(key));
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              // Automatically check for new versions on load
              reg.update().catch(() => {});
            }).catch(() => {});
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
